<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approved leave report</title>
  <style>
    :root { font-family: "Segoe UI", Arial, sans-serif; color: #17324d; background: #f5f7fa; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 28px; }
    main { max-width: 1160px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #52657a; margin: 0 0 22px; }
    .panel { background: white; border: 1px solid #dbe3ec; border-radius: 10px; padding: 22px; box-shadow: 0 2px 8px #0b24400c; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
    select, input, button { font: inherit; min-height: 38px; border-radius: 5px; padding: 7px 11px; }
    select, input { border: 1px solid #9aabc0; background: white; }
    button { border: 1px solid #006dc2; background: #0078d4; color: white; font-weight: 600; cursor: pointer; }
    button.secondary { background: white; color: #0063ae; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin: 18px 0 0; min-height: 24px; }
    .error { color: #ae2c2c; }
    .scroll { overflow: auto; margin-top: 18px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5ebf1; padding: 10px 12px; text-align: left; white-space: nowrap; }
    th { background: #eef4fb; color: #294562; }
  </style>
</head>
<body>
<main>
  <h1>Approved leave report</h1>
  <p>Choose a calendar period. The report includes approved leave that overlaps any day in that period.</p>
  <div class="panel">
    <div class="controls">
      <label>Report period <select id="period"><option value="month">Monthly</option><option value="quarter">Quarterly</option><option value="year">Yearly</option></select></label>
      <label>Year <input id="year" type="number" min="2000" max="2100" step="1"></label>
      <label id="monthWrap">Month <select id="month"></select></label>
      <label id="quarterWrap" hidden>Quarter <select id="quarter"><option value="1">Q1 (Jan–Mar)</option><option value="2">Q2 (Apr–Jun)</option><option value="3">Q3 (Jul–Sep)</option><option value="4">Q4 (Oct–Dec)</option></select></label>
      <button id="preview">Preview report</button>
      <button id="export" class="secondary" disabled>Download CSV</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="scroll"><table id="results" hidden><thead><tr><th>Request</th><th>Employee</th><th>Leave type</th><th>Start date</th><th>End date</th><th>Hours per day</th><th>Approved on</th></tr></thead><tbody></tbody></table></div>
  </div>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const now = new Date();
  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  months.forEach((name, index) => { const option = document.createElement("option"); option.value = String(index + 1); option.textContent = name; $("month").append(option); });
  $("year").value = String(now.getFullYear());
  $("month").value = String(now.getMonth() + 1);
  $("quarter").value = String(Math.floor(now.getMonth() / 3) + 1);
  let rows = [], rangeKey = "";
  function range() {
    const year = Number($("year").value), period = $("period").value;
    if (!Number.isInteger(year) || year < 2000 || year > 2100) throw new Error("Enter a year from 2000 to 2100.");
    const month = period === "month" ? Number($("month").value) : period === "quarter" ? (Number($("quarter").value) - 1) * 3 + 1 : 1;
    const span = period === "month" ? 1 : period === "quarter" ? 3 : 12;
    const start = `${year}-${String(month).padStart(2, "0")}-01`;
    const endDate = new Date(Date.UTC(year, month - 1 + span, 0));
    const end = endDate.toISOString().slice(0, 10);
    return { start, end, key: `${period}_${year}_${month}` };
  }
  function invalidate() {
    rows = []; rangeKey = ""; $("results").hidden = true; $("export").disabled = true; $("status").textContent = "";
    $("monthWrap").hidden = $("period").value !== "month";
    $("quarterWrap").hidden = $("period").value !== "quarter";
  }
  ["period", "year", "month", "quarter"].forEach(id => $(id).addEventListener("change", invalidate));
  invalidate();
  function formatted(row, field) { return row[field + "@OData.Community.Display.V1.FormattedValue"] || ""; }
  async function load() {
    const selected = range();
    const columns = "cr2c9_leaverequestnumber,cr2c9_startdate,cr2c9_enddate,cr2c9_hoursperday,cr2c9_decisionon,_cr2c9_employeename_value,_cr2c9_leavetypename_value";
    const filter = `cr2c9_status eq 1 and cr2c9_startdate le ${selected.end} and cr2c9_enddate ge ${selected.start}`;
    let url = `/api/data/v9.2/cr2c9_leaverequests?$select=${columns}&$filter=${encodeURIComponent(filter)}&$orderby=cr2c9_startdate desc,createdon desc`;
    const result = [];
    while (url) {
      const response = await fetch(url, { credentials: "same-origin", headers: { Accept: "application/json", Prefer: 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"' } });
      if (!response.ok) throw new Error(`Report could not be loaded (${response.status}). Check your HR role and try again.`);
      const body = await response.json();
      result.push(...body.value);
      url = body["@odata.nextLink"] || "";
      if (url && new URL(url, location.origin).origin !== location.origin) throw new Error("Unexpected report page address.");
    }
    return { result, selected };
  }
  function render() {
    const tbody = $("results").querySelector("tbody"); tbody.replaceChildren();
    for (const row of rows) {
      const values = [row.cr2c9_leaverequestnumber, formatted(row, "_cr2c9_employeename_value"), formatted(row, "_cr2c9_leavetypename_value"),
        String(row.cr2c9_startdate || "").slice(0, 10), String(row.cr2c9_enddate || "").slice(0, 10), row.cr2c9_hoursperday,
        String(row.cr2c9_decisionon || "").slice(0, 10)];
      const tr = document.createElement("tr");
      values.forEach(value => { const td = document.createElement("td"); td.textContent = value == null ? "" : String(value); tr.append(td); });
      tbody.append(tr);
    }
    $("results").hidden = false;
    $("status").textContent = `${rows.length} approved request${rows.length === 1 ? "" : "s"} overlap this period.`;
  }
  $("preview").addEventListener("click", async () => {
    $("preview").disabled = true; $("export").disabled = true; $("status").textContent = "Loading approved leave…"; $("status").className = "";
    try { const loaded = await load(); rows = loaded.result; rangeKey = loaded.selected.key; render(); $("export").disabled = false; }
    catch (error) { rows = []; rangeKey = ""; $("results").hidden = true; $("status").textContent = error.message; $("status").className = "error"; }
    finally { $("preview").disabled = false; }
  });
  function csvCell(value) {
    let text = value == null ? "" : String(value);
    if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }
  $("export").addEventListener("click", () => {
    if (!rangeKey || range().key !== rangeKey) return invalidate();
    const header = ["Request", "Employee", "Leave type", "Start date", "End date", "Hours per day", "Approved on"];
    const lines = [header.map(csvCell).join(",")];
    $("results").querySelectorAll("tbody tr").forEach(tr => lines.push(Array.from(tr.cells, cell => csvCell(cell.textContent)).join(",")));
    const blob = new Blob(["\ufeff", lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `approved_leave_${rangeKey}.csv`; document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
})();
</script>
</body>
</html>
